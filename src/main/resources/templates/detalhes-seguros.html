<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL Seguros - Detalhes do Cliente</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body style="background-color: #f8fafc;">

    <div class="adm-container-seguros">
        <a th:href="@{/admin/usuarios}" class="adm-btn-voltar-link">
            <i class="fas fa-chevron-left"></i> Voltar à Lista de Clientes
        </a>

        <h2 class="adm-cliente-titulo">
            <i class="fas fa-id-card"></i>
            Seguros Contratados por: <span class="adm-cliente-nome" th:text="${cliente.nome}">Nome do Cliente</span>
        </h2>

        <div th:each="apolice : ${apolices}" class="adm-card-seguro">
            <div class="adm-info-principal">
                <h3 th:text="${apolice.nomeProduto}">Nome do Seguro</h3>

                <div class="adm-info-detalhes">
                    <p>
                        <i class="fas fa-car-side"></i>
                        Placa do Veículo: <strong th:text="${apolice.placa}">ABC-1234</strong>
                    </p>
                    <div class="adm-valor-tag">
                        <i class="fas fa-receipt"></i>
                        Prêmio: R$ <span th:text="${#numbers.formatDecimal(apolice.valor, 1, 2, 'POINT')}">0.00</span>
                    </div>
                </div>
            </div>

            <div class="adm-status-ativo">
                <i class="fas fa-check-circle"></i> ATIVO
            </div>
        </div>

        <div th:if="${#lists.isEmpty(apolices)}"
            style="text-align: center; padding: 60px; background: white; border-radius: 12px; border: 2px dashed #e2e8f0;">
            <i class="fas fa-folder-open"
                style="font-size: 3rem; color: #cbd5e0; margin-bottom: 15px; display: block;"></i>
            <p style="color: #718096; font-size: 1.1rem;">Este usuário ainda não possui apólices vinculadas no sistema.
            </p>
        </div>
    </div>

</body>

</html>
