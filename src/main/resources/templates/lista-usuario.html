<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL Seguros - Gestão de Clientes</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="adm-header">
        <div class="container topo">
            <h1>YL Seguros - Administração</h1>
            <nav>
                <ul>
                    <li><a th:href="@{/admin/painel}" class="btn-destaque"><i class="fas fa-arrow-left"></i> Painel</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="adm-caixa-lista">
            <h2><i class="fas fa-users-cog"></i> Clientes Cadastrados</h2>
            <p style="color: #718096; margin-bottom: 25px;">Gerencie os acessos e visualize os contratos de cada
                usuário.</p>

            <table class="adm-tabela-clientes">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Perfil</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td style="font-weight: 600; color: #2d3748;" th:text="${u.nome}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.telefone != null and u.telefone != '' ? u.telefone : '---'}"></td>
                        <td>
                            <span th:text="${u.perfil}"
                                th:classappend="${u.perfil == 'ADM' ? 'adm-status-badge badge-adm' : 'adm-status-badge badge-user'}">
                            </span>
                        </td>
                        <td style="text-align: center;">
                            <a th:href="@{/admin/usuarios/seguros/{email}(email=${u.email})}"
                                class="adm-btn-ver-seguros">
                                <i class="fas fa-file-shield"></i> Ver Seguros
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(usuarios)}" style="padding: 50px; text-align: center; color: #a0aec0;">
                <i class="fas fa-search" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                Nenhum usuário encontrado no sistema.
            </div>
        </div>
    </main>

    <footer class="rodape-inferior">
        <p>&copy; 2026 YL Seguros - Área de Gestão de Clientes</p>
    </footer>
</body>

</html>
