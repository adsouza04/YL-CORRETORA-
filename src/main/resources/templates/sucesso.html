<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL Seguros | Pagamento Confirmado</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
    <style>
        body {
            background-color: #f0f4f8;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container-sucesso {
            max-width: 550px;
            margin: 80px auto;
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-check {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            margin: 0 auto 25px;
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.2);
        }

        .titulo-sucesso {
            color: #002855;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .resumo-compra {
            text-align: left;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 40px;
            border: 1px solid #edf2f7;
        }

        .resumo-compra h3 {
            font-size: 0.9rem;
            color: #0046c0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
        }

        .item-resumo {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1rem;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f4f8;
        }

        .item-resumo:last-of-type {
            border-bottom: none;
        }

        .label {
            color: #718096;
            font-weight: 500;
        }

        .valor-dado {
            color: #2d3748;
            font-weight: 600;
            text-align: right;
        }

        .total-final {
            background-color: #f8fbff;
            margin: 20px -30px -30px -30px;
            padding: 25px 30px;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px dashed #e2e8f0;
        }

        .total-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #002855;
        }

        .total-valor {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0046c0;
        }

        .btn-home {
            display: block;
            background: linear-gradient(135deg, #0056b3 0%, #003d80 100%);
            color: white;
            padding: 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 86, 179, 0.2);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0, 86, 179, 0.3);
        }
    </style>
</head>

<body>

    <header>
        <div class="container topo">
            <h1>YL Seguros</h1>
            <nav>
                <ul>
                    <li><a th:href="@{/home}">Home</a></li>
                    <li><a th:href="@{/planos}">Planos</a></li>
                    <li><a th:href="@{/login}" class="btn-destaque">Minha Conta</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container-sucesso">
        <div class="icon-check">✓</div>
        <h1 class="titulo-sucesso">Tudo pronto!</h1>
        <p class="subtitulo">Sua apólice foi emitida e o pagamento confirmado.</p>

        <div class="resumo-compra">
            <h3>Detalhes da Contratação</h3>

            <div class="item-resumo">
                <span class="label">Segurado</span>
                <span class="valor-dado" th:text="${nomeCliente}">João Almeida</span>
            </div>

            <div class="item-resumo">
                <span class="label">Plano Ativado</span>
                <span class="valor-dado" th:text="${nomeProduto}">Premium</span>
            </div>

            <div class="item-resumo">
                <span class="label">Placa do Veículo</span>
                <span class="valor-dado" th:text="${placaVeiculo}">ABC-1234</span>
            </div>

            <div class="item-resumo">
                <span class="label">Data e Hora</span>
                <span class="valor-dado"
                    th:text="${#calendars.format(#calendars.createNow(), 'dd/MM/yyyy HH:mm')}">09/05/2026</span>
            </div>

            <div class="total-final">
                <span class="total-label">Total Pago</span>
                <span class="total-valor" th:text="${valorPago != null ? 'R$ ' + valorPago : 'R$ 0,00'}">
                    R$ 0,00
                </span>
            </div>
        </div>

        <a th:href="@{/home}" class="btn-home">Ir para o Painel Inicial</a>
    </div>

</body>

</html>
