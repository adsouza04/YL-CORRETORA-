<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo da Proposta | YL Seguros</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
    <style>
        .resumo-container {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 650px;
            margin: 50px auto;
        }

        .resumo-header {
            background-color: #002855;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .resumo-corpo {
            padding: 40px;
        }

        .tabela-resumo {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .tabela-resumo td {
            padding: 15px 0;
            border-bottom: 1px dashed #ddd;
        }

        .item-nome {
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .item-preco {
            text-align: right;
            font-weight: bold;
            color: #002855;
        }

        .total-destaque {
            background: #f8fff9;
            border: 1px solid #d4edda;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .alerta-auto {
            background: #fff4f4;
            border-left: 5px solid #d9534f;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .input-placa {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.5rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
            color: #002855;
            margin-top: 10px;
            transition: 0.3s;
        }

        .input-placa:focus {
            border-color: #d9534f;
            outline: none;
            box-shadow: 0 0 10px rgba(217, 83, 79, 0.2);
        }

        .btn-pessoais {
            background-color: #ff9900;
            color: white;
            padding: 18px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 153, 0, 0.3);
        }

        .btn-pessoais:hover {
            background-color: #e68a00;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <header>
        <div class="container topo">
            <h1>YL Seguros</h1>
            <nav>
                <ul>
                    <li><a th:href="@{/home}">Home</a></li>
                    <li><a th:href="@{/carrinho}">🛒 Carrinho</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="resumo-container">
            <div class="resumo-header">
                <h2 style="margin: 0;">📋 Resumo da Proposta</h2>
                <p style="opacity: 0.8; margin-top: 10px;">Revise seus planos antes de prosseguir</p>
            </div>

            <div class="resumo-corpo">
                <table class="tabela-resumo">
                    <tbody>
                        <tr th:each="item : ${itens}">
                            <td class="item-nome">
                                <span>🛡️</span> <span th:text="${item.nomePlano}">PLANO</span>
                            </td>
                            <td class="item-preco"
                                th:text="'R$ ' + ${#numbers.formatDecimal(item.preco, 1, 'POINT', 2, 'COMMA')}">
                                R$ 0,00
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="total-destaque">
                    <span style="font-weight: bold; color: #555;">Investimento Mensal:</span>
                    <span style="color: #28a745; font-size: 1.6rem; font-weight: 800;"
                        th:text="'R$ ' + ${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}">
                        R$ 0,00
                    </span>
                </div>

                <form th:action="@{/carrinho/dados-pessoais}" method="GET">

                    <div th:if="${temSeguroAuto}" class="alerta-auto">
                        <label style="color: #d9534f; font-weight: 800; display: block; margin-bottom: 5px;">
                            🚗 INFORMAÇÃO NECESSÁRIA
                        </label>
                        <p style="font-size: 0.9rem; color: #666;">
                            Para o <strong>Seguro Auto</strong>, precisamos da placa do veículo:
                        </p>
                        <input type="text" name="placa" class="input-placa" placeholder="ABC1D23" maxlength="7"
                            required>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                        <a th:href="@{/carrinho}" style="color: #888; text-decoration: none; font-weight: 600;">
                            Voltar ao carrinho
                        </a>
                        <button type="submit" class="btn-pessoais">
                            Dados Pessoais
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
