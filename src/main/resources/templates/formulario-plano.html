<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL Seguros - Configurar Produto</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="adm-body-form">

    <div class="adm-card-form">
        <h2 class="adm-form-titulo"><i class="fas fa-edit"></i> Configurar Produto</h2>
        <hr class="adm-form-divisor">

        <form th:action="@{/admin/configurar/salvar}" th:object="${seguro}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="adm-campo-grupo">
                <label><i class="fas fa-tag"></i> Nome do Plano:</label>
                <input type="text" th:field="*{nome}" class="adm-input" placeholder="Ex: Essencial Auto" required>
            </div>

            <div class="adm-campo-grupo">
                <label><i class="fas fa-dollar-sign"></i> Valor Mensal (R$):</label>
                <input type="number" step="0.01" th:field="*{valorMensal}" class="adm-input" placeholder="0.00"
                    required>
            </div>

            <div class="adm-campo-grupo">
                <label><i class="fas fa-list"></i> Categoria:</label>
                <input type="text" th:field="*{categoria}" class="adm-input" placeholder="Ex: Auto, Vida, Residencial"
                    required>
            </div>

            <div class="adm-campo-grupo">
                <label><i class="fas fa-align-left"></i> Descrição/Coberturas:</label>
                <textarea th:field="*{descricao}" class="adm-input adm-textarea"
                    placeholder="Descreva os benefícios do plano..." required></textarea>
            </div>

            <button type="submit" class="adm-btn-salvar">
                <i class="fas fa-check-circle"></i> Salvar Produto
            </button>

            <a th:href="@{/admin/configurar}" class="adm-link-cancelar">
                <i class="fas fa-times"></i> Cancelar e Voltar
            </a>
        </form>
    </div>

</body>

</html>
